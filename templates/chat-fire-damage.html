<div class="wod-chat-card">
    <div class="wod-chat-header">
        <h3>{{actorName}} — {{weaponName}} (Damage)</h3>
    </div>
    <div class="wod-chat-body">
        <div class="wod-chat-pool">{{pool}}</div>
        <div class="wod-chat-difficulty">Difficulty: {{difficulty}}</div>
        <div class="wod-chat-dice">{{{diceHTML}}}</div>
        <div class="wod-chat-damage-total">Урон: {{damageTotal}} ({{damageType}})</div>
    </div>
</div>
