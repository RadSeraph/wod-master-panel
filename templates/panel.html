<div class="wod-panel-container">
    <!-- Вкладки -->
    <div class="wod-panel-tabs">
        <button type="button" class="wod-tab-btn active" data-tab="tab-health">Здоровье</button>
        <button type="button" class="wod-tab-btn" data-tab="tab-resources">Ресурсы</button>
        <button type="button" class="wod-tab-btn" data-tab="tab-disciplines">Дисциплины</button>
        <button type="button" class="wod-tab-btn" data-tab="tab-firearms">Огонь</button>
    </div>

    <!-- Вкладка: Здоровье -->
    <div id="tab-health" class="wod-tab-content active">
        <div id="health-npc-block" style="display: none; margin-bottom: 10px; padding: 5px; background: rgba(0,0,0,0.1); border-radius: 4px; border: 1px solid #444;">
            <label style="font-weight: bold; color: #000; margin-bottom: 2px; display: block; font-size: 13px;">Выбрать NPC:</label>
            <select id="health-npc-select" style="width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #666; color: #000; font-size: 13px;"></select>
        </div>
        <div id="health-actor-list" style="margin-bottom: 10px;"></div>
        <div style="margin-bottom: 10px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.05); padding: 4px; border-radius: 4px; border-top: 1px solid #555;">
            <input type="checkbox" id="health-use-blood" checked style="margin-right: 6px; cursor: pointer; transform: scale(1.1);">
            <label for="health-use-blood" style="cursor: pointer; font-size: 13px; font-weight: bold; color: #000;">Тратить Кровь на лечение</label>
        </div>
        <div style="margin-bottom: 5px;">
            <div class="wod-resource-title" style="color: #000;">Дробящий (Bashing)</div>
            <div class="wod-grid" id="grid-bashing"></div>
        </div>
        <div class="wod-resource-section">
            <div class="wod-resource-title" style="color: #000;">Летальный (Lethal)</div>
            <div class="wod-grid" id="grid-lethal"></div>
        </div>
        <div class="wod-resource-section">
            <div class="wod-resource-title" style="color: #000;">Аггравированный (Aggravated)</div>
            <div class="wod-grid" id="grid-aggravated"></div>
        </div>
    </div>

    <!-- Вкладка: Ресурсы -->
    <div id="tab-resources" class="wod-tab-content">
        <div id="res-npc-block" style="display: none; margin-bottom: 10px; padding: 5px; background: rgba(0,0,0,0.1); border-radius: 4px; border: 1px solid #444;">
            <label style="font-weight: bold; color: #000; margin-bottom: 2px; display: block; font-size: 13px;">Выбрать NPC:</label>
            <select id="res-npc-select" style="width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #666; color: #000; font-size: 13px;"></select>
        </div>
        <div id="res-actor-list" style="margin-bottom: 10px;"></div>
        <div class="wod-resource-section">
            <div class="wod-resource-title" style="color: #8b0000;">Кровь</div>
            <div class="wod-grid" id="grid-blood"></div>
        </div>
        <div class="wod-resource-section">
            <div class="wod-resource-title" style="color: #00008b;">Воля</div>
            <div class="wod-grid" id="grid-will"></div>
        </div>
    </div>

    <!-- Вкладка: Дисциплины -->
    <div id="tab-disciplines" class="wod-tab-content">
        <div id="disc-npc-block" style="display: none; margin-bottom: 10px; padding: 5px; background: rgba(0,0,0,0.1); border-radius: 4px; border: 1px solid #444;">
            <label style="font-weight: bold; color: #000; margin-bottom: 2px; display: block; font-size: 13px;">Выбрать персонажа:</label>
            <select id="disc-npc-select" style="width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #666; color: #000; font-size: 13px;"></select>
        </div>

        <div class="form-group" id="disc-actor-block" style="margin-bottom: 10px;">
            <label>Персонаж:</label>
            <select id="disc-actor-select" style="width: 100%;"></select>
        </div>

        <div class="form-group" style="margin-top: 10px;">
            <label>Сила:</label>
            <select id="disc-power-select" style="width: 100%;"></select>
        </div>

        <div id="disc-description" class="wod-desc-block"></div>
        <div id="disc-req-block" class="wod-req-block"></div>

        <div class="form-group" id="disc-spec-block" style="display: none; margin-top: 10px; padding: 5px; background: rgba(0,0,0,0.05); border-radius: 4px;">
            <label style="display: flex; align-items: center; cursor: pointer; margin: 0;">
                <input type="checkbox" id="disc-use-spec" style="margin-right: 8px; width: 16px; height: 16px;">
                <span>Специализация: <strong id="disc-spec-name"></strong></span>
            </label>
        </div>

        <div class="form-group" style="margin-top: 10px; padding: 5px; background: rgba(0,0,0,0.05); border-radius: 4px;">
            <label style="display: flex; align-items: center; cursor: pointer; margin: 0;">
                <input type="checkbox" id="disc-use-will" style="margin-right: 8px; width: 16px; height: 16px;">
                <span>Тратить Силу Воли <em style="color: #666; font-size: 0.9em;">(+1 автоуспех, -1 Воля)</em></span>
            </label>
            <label style="display: flex; align-items: center; cursor: pointer; margin: 5px 0 0 0;">
                <input type="checkbox" id="disc-ignore-wounds" style="margin-right: 8px; width: 16px; height: 16px;">
                <span>Игнорировать штрафы от ран</span>
            </label>
        </div>

        <div class="form-group" style="margin-top: 10px;">
            <label>Сложность броска:</label>
            <div id="disc-difficulty-buttons" style="display: flex; gap: 4px; margin-top: 4px;"></div>
            <input type="hidden" id="disc-difficulty" value="6">
        </div>

        <div class="form-group" style="margin-top: 10px; padding: 5px; background: rgba(0,0,0,0.05); border-radius: 4px;">
            <label style="display: flex; align-items: center; cursor: pointer; margin: 0; color: #8b0000; font-weight: bold;">
                <input type="checkbox" id="disc-blind-roll" style="margin-right: 8px; width: 16px; height: 16px;">
                <span>Скрытый бросок (виден только Мастеру)</span>
            </label>
        </div>

        <div id="disc-final-cost" class="wod-final-cost">
            Стоимость: 0
        </div>
    </div>

    <!-- Вкладка: Огонь (стрельба) -->
    <div id="tab-firearms" class="wod-tab-content">
        <div id="fire-npc-block" style="display: none; margin-bottom: 10px; padding: 5px; background: rgba(0,0,0,0.1); border-radius: 4px; border: 1px solid #444;">
            <label style="font-weight: bold; color: #000; margin-bottom: 2px; display: block; font-size: 13px;">Выбрать персонажа:</label>
            <select id="fire-npc-select" style="width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #666; color: #000; font-size: 13px;"></select>
        </div>

        <div class="form-group" id="fire-actor-block" style="margin-bottom: 10px; display: none;">
            <label>Персонаж:</label>
            <select id="fire-actor-select" style="width: 100%;"></select>
        </div>

        <div class="form-group" style="margin-top: 10px; margin-bottom: 10px;">
            <label style="font-weight: bold; color: #000; font-size: 13px; margin-bottom: 3px; display: block;">Оружие:</label>
            <select id="fire-weapon-select" style="width: 100%; padding: 4px; border: 1px solid #666; border-radius: 4px; font-size: 13px;"></select>
        </div>

        <div class="form-group" style="margin-top: 10px; margin-bottom: 10px;">
            <label style="font-weight: bold; color: #000; font-size: 13px; margin-bottom: 3px; display: block;">Режим стрельбы:</label>
            <div id="fire-mode-buttons" style="display: flex; flex-direction: column; gap: 3px;"></div>
        </div>

        <div id="fire-ammo-info" style="margin-top: 10px; margin-bottom: 10px; font-size: 1em; text-align: center; color: #333; font-weight: bold; background: rgba(0,0,0,0.05); padding: 5px; border-radius: 4px;">
            В магазине: 0 / 0
        </div>

        <div style="margin-bottom: 10px;">
            <label style="font-weight: bold; font-size: 13px;">Тип урона:</label>
            <div style="display: flex; gap: 4px; margin-top: 4px;">
                <button type="button" class="fire-dmg-type-btn" data-val="bashing" style="flex:1; padding:4px; font-size:12px; cursor:pointer; border:1px solid #999; border-radius:4px;">Ударный</button>
                <button type="button" class="fire-dmg-type-btn active" data-val="lethal" style="flex:1; padding:4px; font-size:12px; cursor:pointer; border:1px solid #999; border-radius:4px; background:#2c6b81; color:white;">Летальный</button>
                <button type="button" class="fire-dmg-type-btn" data-val="aggravated" style="flex:1; padding:4px; font-size:12px; cursor:pointer; border:1px solid #999; border-radius:4px;">Аггравированный</button>
            </div>
        </div>

        <div style="margin-bottom: 10px;">
            <label style="font-weight: bold; font-size: 13px;">Сложность:</label>
            <div id="fire-difficulty-buttons" style="display: flex; gap: 4px; margin-top: 4px;"></div>
            <input type="hidden" id="fire-difficulty" value="6">
        </div>

        <div style="margin-bottom: 10px;">
            <label style="font-weight: bold; font-size: 13px;">Бонус/Штраф кубов:</label>
            <input type="number" id="fire-manual-bonus" value="0" style="width: 100%; padding: 4px; border: 1px solid #999; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 10px; padding: 5px; background: rgba(0,0,0,0.05); border-radius: 4px;">
            <label style="display: flex; align-items: center; cursor: pointer; margin: 0; font-size: 0.9em;">
                <input type="checkbox" id="fire-use-will" style="margin-right: 8px;">
                <span>Тратить Силу Воли (+1 автоуспех, -1 Воля)</span>
            </label>
            <label style="display: flex; align-items: center; cursor: pointer; margin: 5px 0 0 0; font-size: 0.9em;">
                <input type="checkbox" id="fire-ignore-wounds" style="margin-right: 8px;">
                <span>Игнорировать штрафы от ран</span>
            </label>
            <label style="display: flex; align-items: center; cursor: pointer; margin: 5px 0 0 0; font-size: 0.9em; color: #8b0000;">
                <input type="checkbox" id="fire-blind-roll" style="margin-right: 8px;">
                <span>Скрытый бросок (виден только Мастеру)</span>
            </label>
        </div>

        <button type="button" id="fire-btn" style="margin-top: 15px; padding: 8px 16px; background: #8b0000; color: white; border: 1px solid #5c0000; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s;">
            Огонь!
        </button>
    </div>
</div>
