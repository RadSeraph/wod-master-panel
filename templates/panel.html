<div class="wod-panel-container">
    <!-- Вкладки -->
    <div class="wod-panel-tabs">
        <button type="button" class="wod-tab-btn active" data-tab="tab-health">Здоровье</button>
        <button type="button" class="wod-tab-btn" data-tab="tab-resources">Ресурсы</button>
        <button type="button" class="wod-tab-btn" data-tab="tab-disciplines">Дисциплины</button>
    </div>

    <!-- Вкладка: Здоровье -->
    <div id="tab-health" class="wod-tab-content active">
        <div id="health-npc-block" style="display: none; margin-bottom: 10px; padding: 5px; background: rgba(0,0,0,0.1); border-radius: 4px; border: 1px solid #444;">
            <label style="font-weight: bold; color: #000; margin-bottom: 2px; display: block; font-size: 13px;">Выбрать NPC:</label>
            <select id="health-npc-select" style="width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #666; color: #000; font-size: 13px;">
                <!-- Опции добавятся скриптом -->
            </select>
        </div>

        <div id="health-actor-list" style="margin-bottom: 10px;">
            <!-- Кнопки персонажей добавятся скриптом -->
        </div>

        <div style="margin-bottom: 10px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.05); padding: 4px; border-radius: 4px; border-top: 1px solid #555;">
            <input type="checkbox" id="health-use-blood" checked style="margin-right: 6px; cursor: pointer; transform: scale(1.1);">
            <label for="health-use-blood" style="cursor: pointer; font-size: 13px; font-weight: bold; color: #000;">Тратить Кровь на лечение</label>
        </div>

        <div style="margin-bottom: 5px;">
            <div class="wod-resource-title" style="color: #000;">Дробящий (Bashing)</div>
            <div class="wod-grid" id="grid-bashing"></div>
        </div>
        <div class="wod-resource-section">
            <div class="wod-resource-title" style="color: #000;">Летальный (Lethal)</div>
            <div class="wod-grid" id="grid-lethal"></div>
        </div>
        <div class="wod-resource-section">
            <div class="wod-resource-title" style="color: #000;">Аггравированный (Aggravated)</div>
            <div class="wod-grid" id="grid-aggravated"></div>
        </div>
    </div>

    <!-- Вкладка: Ресурсы -->
    <div id="tab-resources" class="wod-tab-content">
        <div id="res-npc-block" style="display: none; margin-bottom: 10px; padding: 5px; background: rgba(0,0,0,0.1); border-radius: 4px; border: 1px solid #444;">
            <label style="font-weight: bold; color: #000; margin-bottom: 2px; display: block; font-size: 13px;">Выбрать NPC:</label>
            <select id="res-npc-select" style="width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #666; color: #000; font-size: 13px;">
                <!-- Опции добавятся скриптом -->
            </select>
        </div>

        <div id="res-actor-list" style="margin-bottom: 10px;">
            <!-- Кнопки персонажей добавятся скриптом -->
        </div>

        <div class="wod-resource-section">
            <div class="wod-resource-title" style="color: #8b0000;">Кровь</div>
            <div class="wod-grid" id="grid-blood"></div>
        </div>
        <div class="wod-resource-section">
            <div class="wod-resource-title" style="color: #00008b;">Воля</div>
            <div class="wod-grid" id="grid-will"></div>
        </div>
    </div>

    <!-- Вкладка: Дисциплины -->
    <div id="tab-disciplines" class="wod-tab-content">
        <div id="disc-npc-block" style="display: none; margin-bottom: 10px; padding: 5px; background: rgba(0,0,0,0.1); border-radius: 4px; border: 1px solid #444;">
            <label style="font-weight: bold; color: #000; margin-bottom: 2px; display: block; font-size: 13px;">Выбрать персонажа:</label>
            <select id="disc-npc-select" style="width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #666; color: #000; font-size: 13px;">
                <!-- Опции добавятся скриптом -->
            </select>
        </div>

        <div class="form-group" id="disc-actor-block" style="margin-bottom: 10px;">
            <label>Персонаж:</label>
            <select id="disc-actor-select" style="width: 100%;"></select>
        </div>

        <div class="form-group" style="margin-top: 10px;">
            <label>Сила:</label>
            <select id="disc-power-select" style="width: 100%;"></select>
        </div>

        <div id="disc-description" class="wod-desc-block"></div>

        <div id="disc-req-block" class="wod-req-block"></div>

        <div class="form-group" id="disc-spec-block" style="display: none; margin-top: 10px; padding: 5px; background: rgba(0,0,0,0.05); border-radius: 4px;">
            <label style="display: flex; align-items: center; cursor: pointer; margin: 0;">
                <input type="checkbox" id="disc-use-spec" style="margin-right: 8px; width: 16px; height: 16px;">
                <span>Специализация: <strong id="disc-spec-name"></strong></span>
            </label>
        </div>

        <div class="form-group" style="margin-top: 10px; padding: 5px; background: rgba(0,0,0,0.05); border-radius: 4px;">
            <label style="display: flex; align-items: center; cursor: pointer; margin: 0;">
                <input type="checkbox" id="disc-use-will" style="margin-right: 8px; width: 16px; height: 16px;">
                <span>Тратить Силу Воли <em style="color: #666; font-size: 0.9em;">(+1 автоуспех, -1 Воля)</em></span>
            </label>
        </div>

        <div class="form-group" style="margin-top: 10px;">
            <label>Сложность броска:</label>
            <input type="number" id="disc-difficulty" value="6" style="width: 100%;" />
        </div>

        <div id="disc-final-cost" class="wod-final-cost">
            Стоимость: 0
        </div>
    </div>
</div>
